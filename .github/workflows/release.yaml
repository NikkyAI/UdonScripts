name: 'Release'
on:
  workflow_dispatch: {}
  push: {}
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/release.yaml'' && ''.github/workflows/release.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/release.yaml'''
  build:
    runs-on: 'ubuntu-latest'
    concurrency:
      group: '${{ github.ref }}-${{ matrix.package-name }}'
      cancel-in-progress: false
    needs:
    - 'check_yaml_consistency'
    env:
      packagePath: '${{ matrix.package-name }}'
    strategy:
      matrix:
        package-name:
        - 'moe.nikky.common'
        - 'moe.nikky.kinetic-controls'
        - 'moe.nikky.kinetic-controls.audiolink'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'get version from package.json'
      uses: 'zoexx/github-action-json-file-properties@1.0.6'
      with:
        file_path: '${{ matrix.package-name }}/package.json'
        prop_path: 'version'
    - id: 'step-2'
      name: 'precompute variables'
      run: |-
        FULL_PACKAGE=${{ matrix.package-name }}
        SHORT_PACKAGE=${FULL_PACKAGE#moe.nikky.}
        echo "tag=$SHORT_PACKAGE-${{ steps.step-1.outputs.value }}" >> $GITHUB_OUTPUT
        echo "zipFile=$SHORT_PACKAGE-${{ steps.step-1.outputs.value }}".zip >> $GITHUB_OUTPUT
        echo "unityPackage=$SHORT_PACKAGE-${{ steps.step-1.outputs.value }}".unitypackage >> $GITHUB_OUTPUT
    - id: 'step-3'
      name: 'Check Tag exists'
      uses: 'mukunku/tag-exists-action@v1.7.0'
      with:
        tag: '${{ steps.step-2.outputs.tag }}'
    - id: 'step-4'
      name: 'Create Package Zip'
      working-directory: '${{ matrix.package-name }}'
      run: 'zip -r "${{ github.workspace }}/${{ steps.step-2.outputs.zipFile }}" .'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-5'
      name: 'Track Package Meta Files'
      run: 'find "${{ matrix.package-name }}/" -name \*.meta >> metaList-${{ matrix.package-name }}'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-6'
      name: 'Create UnityPackage'
      uses: 'pCYSl5EDgo/create-unitypackage@v1.2.3'
      with:
        package-path: '${{ steps.step-2.outputs.unityPackage }}'
        include-files: 'metaList-${{ matrix.package-name }}'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-7'
      name: 'Create Tag'
      uses: 'rickstaa/action-create-tag@v1.7.2'
      with:
        tag: '${{ steps.step-2.outputs.tag }}'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-8'
      name: 'Make Release'
      uses: 'softprops/action-gh-release@v2'
      with:
        tag_name: '${{ steps.step-2.outputs.tag }}'
        files: |-
          ${{ steps.step-2.outputs.zipFile }}
          ${{ steps.step-2.outputs.unityPackage }}
          ${{ matrix.package-name }}/package.json
      if: 'steps.step-3.outputs.exists == ''false'''
  build-done:
    runs-on: 'ubuntu-latest'
    needs:
    - 'build'
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Trigger Workflow'
      env:
        GH_TOKEN: '${{ secrets.PAT }}'
        WORKFLOW: 'build-listing.yml'
        REPO: 'NikkyAi/vpm'
        REF: 'main'
      run: 'gh workflow run $WORKFLOW --repo=$REPO --ref=$REF'
