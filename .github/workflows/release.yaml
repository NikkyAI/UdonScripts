name: 'Release'
on:
  workflow_dispatch: {}
  push: {}
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/release.yaml'' && ''.github/workflows/release.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/release.yaml'''
  build:
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    env:
      packagePath: '${{ matrix.package-name }}'
    strategy:
      matrix:
        package-name:
        - 'moe.nikky.common'
        - 'moe.nikky.kinetic-controls'
        - 'moe.nikky.kinetic-controls-audiolink'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
      with:
        fetch-tags: 'true'
    - id: 'step-1'
      name: 'get version from package.json'
      uses: 'zoexx/github-action-json-file-properties@1.0.6'
      with:
        file_path: '${{ matrix.package-name }}/package.json'
        prop_path: 'version'
    - id: 'step-2'
      name: 'compute tag'
      shell: 'bash'
      run: |-
        PACKAGE=${{ matrix.package-name }}
        echo "tag=${PACKAGE#moe.nikky.}-${{ steps.step-1.outputs.value }}" >> $GITHUB_OUTPUT
    - id: 'step-3'
      name: 'Check Tag exists'
      uses: 'mukunku/tag-exists-action@v1.7.0'
      with:
        tag: 'steps.step-2.outputs.tag'
    - id: 'step-4'
      name: 'Set Environment Variables'
      run: |-
        echo "zipFile=${{ matrix.package-name }}-${{ steps.step-1.outputs.value }}".zip >> $GITHUB_ENV
        echo "unityPackage=${{ matrix.package-name }}-${{ steps.step-1.outputs.value }}.unitypackage" >> $GITHUB_ENV
        echo "version=${{ steps.step-1.outputs.value }}" >> $GITHUB_ENV
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-5'
      name: 'Create Package Zip'
      run: 'zip -r "${{ github.workspace }}/${{ env.zipFile }}" .'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-6'
      name: 'Create UnityPackage'
      uses: 'pCYSl5EDgo/create-unitypackage@v1.2.3'
      with:
        package-path: '${{ env.unityPackage }}'
        include-files: 'metaList'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-7'
      name: 'Create Tag'
      uses: 'rickstaa/action-create-tag@v1.7.2'
      with:
        tag: 'steps.step-2.outputs.tag'
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-8'
      name: 'Make Release'
      uses: 'softprops/action-gh-release@v2'
      with:
        tag_name: 'steps.step-2.outputs.tag'
        files: |-
          ${{ env.zipFile }}
          ${{ env.unityPackage }}
          ${{ matrix.package-name }}/package.json
      if: 'steps.step-3.outputs.exists == ''false'''
    - id: 'step-9'
      name: 'Trigger Workflow'
      env:
        GH_TOKEN: '${{ secrets.PAT }}'
        WORKFLOW: 'build-listing.yml'
        REPO: 'NikkyAi/vpm'
        REF: 'main'
      run: 'gh workflow run $WORKFLOW --repo=$REPO --ref=$REF'
